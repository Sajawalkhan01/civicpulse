name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: "simulated"
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend test dependencies
        run: |
          pip install pytest pytest-cov fakeredis httpx sqlalchemy alembic
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest --cov=app --cov-fail-under=65 tests/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test -- --run

  build-push:
    name: Build, SBOM & Push to GHCR
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
      commit-sha: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner for image naming
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-backend:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-backend:latest

      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-frontend:latest

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-backend:${{ github.sha }}
          format: 'spdx-json'
          output-file: 'backend-sbom.spdx.json'

  deploy-k8s:
    name: Deploy to Ephemeral Cluster & Smoke Test
    needs: [build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up k3d cluster
        uses: nolar/setup-k3d-action@v1
        with:
          version: v5.6.0
          k3d-args: >-
            --port 80:80@loadbalancer
            --port 8000:8000@loadbalancer

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set immutable image tags in prod overlay
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cd k8s/overlays/prod
          kustomize edit set image ghcr.io/sajawalkhan01/civicpulse-backend=ghcr.io/$OWNER/civicpulse-backend:${{ github.sha }}
          kustomize edit set image ghcr.io/sajawalkhan01/civicpulse-frontend=ghcr.io/$OWNER/civicpulse-frontend:${{ github.sha }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for PostgreSQL StatefulSet rollout
        run: |
          kubectl rollout status statefulset/postgres -n civicpulse --timeout=120s

      - name: Wait for Backend Deployment rollout
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=120s

      - name: Wait for Frontend Deployment rollout
        run: |
          kubectl rollout status deployment/frontend -n civicpulse --timeout=120s

      - name: Smoke test Ingress endpoint
        run: |
          # Verify health through ingress
          curl -sf http://localhost/api/health || curl -sf http://localhost:8000/health

      - name: Inspect HPA status
        run: |
          kubectl get hpa -n civicpulse
          kubectl get all -n civicpulse
